[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "WebNovelScraper"
version = "1.1.0"
description = "An accessibility tool to convert web novels into text-to-speech friendly EPUB files"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Tolkium" },
]
keywords = ["web novel", "scraper", "epub", "ebook", "accessibility", "tts"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "EbookLib>=0.18.0",
    "Pillow>=10.0.0",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "ruff>=0.8",
]

[project.scripts]
webnovelscraper = "WebNovelScraper:main"

[project.gui-scripts]
webnovelscraper-desktop = "WebNovelDesktop:main"

[project.urls]
Repository = "https://github.com/Tolkium/WebNovelScraper"

[tool.setuptools]
py-modules = ["WebNovelScraper", "WebNovelDesktop"]
packages = ["webnovel", "webnovel_assets", "browser"]

[tool.setuptools.package-data]
webnovel_assets = ["*.svg", "*.ico"]
browser = ["*.js"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["webnovel_env", "build", "dist", "book", "imports", "env", "ENV"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
